[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lightning"
version = "2.5.0"
description = "Local shim for the quarantined PyPI `lightning` metapackage. Routes lightning.pytorch.* -> pytorch_lightning.* at runtime so pyannote.audio's import of `lightning.pytorch` works without the upstream metapackage. See docs/BLOCKERS.md B-003."
requires-python = ">=3.9"
dependencies = ["pytorch-lightning>=2.0.1"]

[tool.setuptools.packages.find]
include = ["lightning*"]
