# GPU deployment for Alienware (Windows 11 + WSL2 + Docker Desktop + RTX 5090).
#
# Four long-running containers + one one-shot init. All share the tailscale
# sidecar's network namespace, so:
#   - transcribe-svc is reachable at https://transcribe-svc-1.<tailnet>.ts.net
#     (HTTPS via `tailscale serve`; note the -1 — see docs/HANDOFF.md)
#   - speaches binds 127.0.0.1:8001 (transcribe-svc only; not tailnet-visible)
#   - diarize-svc binds 127.0.0.1:8002 (likewise internal)
#   - No host port bindings except tailscale's 127.0.0.1:8000.
#
#   tailscale           netns owner + HTTPS termination
#   speaches            ASR on GPU
#   diarize-svc         pyannote diarization on GPU
#   transcribe-svc      FastAPI orchestrator + PWA (CPU)
#   speaches-model-init one-shot; fetches the ASR model, then exits 0 (B-005)
#
# Bring up: docker compose -f docker-compose.gpu.yml up -d
#
# Prereqs (docs/DEPLOY.md, Windows section):
#   - NVIDIA driver v566+ on the Windows host (Blackwell / WSL2 support)
#   - Windows power settings: never sleep, lid close = do nothing
#   - Docker Desktop with WSL2 backend + Ubuntu-22.04 integration
#   - GPU verify: `docker run --rm --gpus all nvidia/cuda:12.8.0-base-ubuntu22.04 nvidia-smi`
#   - Tailscale reusable auth key with tag:transcribe-svc → TS_AUTHKEY in .env
#     (delete any stale `transcribe-svc` node FIRST — the name is sticky)

name: transcribe-svc

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: transcribe-svc-tailscale
    hostname: transcribe-svc
    # Port publishing must live on the netns owner (this container), since
    # transcribe-svc/speaches share its namespace. Expose ONLY transcribe-svc's
    # 8000 on host loopback for local testing/PWA; the tailnet path is
    # unchanged and Speaches' 8001 stays internal (never published).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_EXTRA_ARGS: --advertise-tags=tag:transcribe-svc --accept-dns=true
      TS_USERSPACE: "false"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status", "--json"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  speaches:
    # PINNED BY DIGEST (B-005). This was `:latest-cuda`, a floating tag — which
    # is how PRELOAD_MODELS silently stopped being honored without any change on
    # our side. This digest is the image verified working on 2026-08-14.
    # To move it deliberately: pull the new tag, re-run the B-005 checks in
    # docs/DEPLOY.md pre-flight, then update this digest.
    image: ghcr.io/speaches-ai/speaches@sha256:6ec12ebf890a17e0d4b242a8ba9e0eb1fb836e60e8a3c857aea9838d541579ac
    container_name: transcribe-svc-speaches
    depends_on:
      tailscale:
        condition: service_healthy
    network_mode: service:tailscale
    environment:
      # Speaches binds to 8001 inside the shared netns; only transcribe-svc
      # reaches it via localhost. Do NOT expose on 0.0.0.0.
      UVICORN_HOST: 127.0.0.1
      UVICORN_PORT: "8001"
      # NOTE: PRELOAD_MODELS is NOT honored by this image — it is read by
      # nothing and downloads nothing (B-005). Kept only so the next person
      # doesn't "helpfully" re-add it. The model is fetched by the
      # speaches-model-init service below, and its absence is now caught by
      # this service's healthcheck instead of silently degrading to CPU.
      PRELOAD_MODELS: '["${ASR_MODEL_ID:-Systran/faster-whisper-large-v3}"]'
      WHISPER__COMPUTE_TYPE: int8_float16
      # PHI posture: silence upstream telemetry/analytics. No audio is ever
      # sent by these, but a private therapy-transcription host should not be
      # making outbound version-check calls either.
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      GRADIO_ANALYTICS_ENABLED: "False"
    volumes:
      - speaches_models:/home/ubuntu/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      # B-005: assert the MODEL is present, not merely that the endpoint answers.
      # /v1/models returns HTTP 200 with {"data":[]} when nothing is downloaded,
      # so the old `curl -fsS .../v1/models` reported HEALTHY on a Speaches that
      # could not serve a single transcription. The router then health-checked it,
      # got a 404 per job, and fell back to CPU — a silent 5-10x slowdown with a
      # 200 response and no error anywhere. Grep for the model id so an empty
      # Speaches shows up as unhealthy instead.
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8001/v1/models | grep -q "${ASR_MODEL_ID:-Systran/faster-whisper-large-v3}"
      interval: 30s
      timeout: 5s
      # First boot downloads ~3 GB (large-v3) via speaches-model-init; keep the
      # container out of "unhealthy" while that runs.
      start_period: 900s
      retries: 3

  # B-005: restores the "a fresh deploy needs no manual pull" behavior that
  # PRELOAD_MODELS was supposed to provide and silently stopped providing.
  # One-shot: waits for the API, exits immediately if the model is already
  # cached, otherwise POSTs the download endpoint (which does work) and verifies
  # the result. Idempotent, so it is a no-op on every subsequent `up`.
  speaches-model-init:
    image: curlimages/curl:8.11.1
    container_name: transcribe-svc-speaches-init
    depends_on:
      tailscale:
        condition: service_healthy
      speaches:
        # service_started, not service_healthy — the healthcheck above now
        # requires the model, which is precisely what this service downloads.
        # Waiting for healthy would deadlock.
        condition: service_started
    network_mode: service:tailscale
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        MODEL="$${ASR_MODEL_ID:-Systran/faster-whisper-large-v3}"
        echo "speaches-model-init: target model = $$MODEL"
        # Wait for the Speaches API (first boot loads before it answers).
        i=0
        while [ "$$i" -lt 120 ]; do
          if curl -fsS -m 5 http://127.0.0.1:8001/v1/models >/dev/null 2>&1; then break; fi
          i=$$((i + 1)); sleep 5
        done
        if ! curl -fsS -m 5 http://127.0.0.1:8001/v1/models >/dev/null 2>&1; then
          echo "speaches-model-init: API never came up; leaving model unfetched." >&2
          echo "speaches will report unhealthy and the ASR router will use CPU." >&2
          exit 1
        fi
        if curl -fsS http://127.0.0.1:8001/v1/models | grep -q "$$MODEL"; then
          echo "speaches-model-init: already cached, nothing to do."
          exit 0
        fi
        echo "speaches-model-init: downloading $$MODEL (~3 GB, several minutes)..."
        curl -fsS --max-time 3600 -X POST "http://127.0.0.1:8001/v1/models/$$MODEL" || true
        if curl -fsS http://127.0.0.1:8001/v1/models | grep -q "$$MODEL"; then
          echo "speaches-model-init: done, model is cached."
        else
          echo "speaches-model-init: FAILED to fetch $$MODEL." >&2
          exit 1
        fi
    environment:
      ASR_MODEL_ID: ${ASR_MODEL_ID:-Systran/faster-whisper-large-v3}

  diarize-svc:
    container_name: transcribe-svc-diarize
    build:
      context: ./diarize-svc
      dockerfile: Dockerfile
    image: transcribe-svc-diarize:cuda
    depends_on:
      tailscale:
        condition: service_healthy
    # Shares the tailscale netns like speaches; binds 127.0.0.1:8002, reachable
    # only by transcribe-svc (never tailnet-published).
    network_mode: service:tailscale
    env_file:
      - .env
    environment:
      # pyannote diarization model + HF token (gated model needs conditions
      # accepted). Same values the local path uses.
      DIARIZATION_MODEL: ${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      HF_HOME: /data/hf
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - diarize_models:/data/hf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/health"]
      interval: 30s
      timeout: 5s
      # First boot downloads the pyannote pipeline weights; keep it out of
      # "unhealthy" while that runs.
      start_period: 300s
      retries: 3

  transcribe-svc:
    container_name: transcribe-svc
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: transcribe-svc:cpu
    depends_on:
      tailscale:
        condition: service_healthy
      # Only service_started, not service_healthy: transcribe-svc has a local
      # WhisperX CPU fallback, so it must not be blocked by Speaches' first-run
      # model download. The ASR router health-checks Speaches per request and
      # falls back to CPU until the GPU backend is ready, then uses the GPU.
      speaches:
        condition: service_started
      # Likewise service_started: diarization has a local CPU fallback, so the
      # sidecar's first-run model download must not block startup. The
      # RemoteDiarizer health-checks per request and falls back to CPU.
      diarize-svc:
        condition: service_started
    network_mode: service:tailscale
    env_file:
      - .env
    environment:
      ASR_BACKEND: router
      ASR_HOSTS: "http://127.0.0.1:8001,local-whisperx"
      # Offload diarization to the GPU sidecar; falls back to in-process CPU
      # pyannote if the sidecar is unreachable.
      DIARIZE_BACKEND: remote
      DIARIZE_URL: "http://127.0.0.1:8002"
    volumes:
      - models:/data/models
      - uploads:/data/uploads
      - outputs:/data/outputs
      # Track B voiceprints. MUST be a volume: ENROLLMENTS_DIR defaults to
      # /data/enrollments, which is otherwise container-local, so every
      # `up -d` would silently discard the enrollment and role labeling would
      # quietly stop working with no error. Contains BIOMETRIC data — keep it
      # local, never on shared/cloud storage, and treat it like a secret.
      - enrollments:/data/enrollments
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  tailscale_state:
  speaches_models:
  diarize_models:
  models:
  uploads:
  outputs:
  # Biometric voiceprints (Track B). Local named volume by design.
  enrollments:
