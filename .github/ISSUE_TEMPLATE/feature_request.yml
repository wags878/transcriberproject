name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you hit, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Please confirm
      options:
        - label: This keeps audio on the operator's own hardware (no third-party API in the transcription path).
          required: true
        - label: This does not break the existing `/v1` contract.
